[project]
name = "vibegame"
version = "0.1.0"
description = "A 2D game builder platform with natural language interface"
authors = [
    {name = "rlhouse", email = "rlhouse@roylee.com"}
]
dependencies = [
    "google-generativeai>=0.3.0",
    "pygame>=2.5.0",
    "numpy>=1.24.0"
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibegame"]
