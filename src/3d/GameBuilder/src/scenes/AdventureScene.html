<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Scene</title> <!-- Updated Title -->
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <script type="module">
        import * as THREE from 'three';
        // Import OrbitControls if needed for debugging/navigation
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Basic scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background

        const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize( window.innerWidth, window.innerHeight );
        renderer.shadowMap.enabled = true; // Enable shadows if needed

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 15, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Controls (Optional, but helpful)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Scene Content from AdventureScene.jsx ---

        // Grassy plane
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: "forestgreen" });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true; // Allow plane to receive shadows
        scene.add(plane);

        // Example Tree Placeholders (Cones)
        const treeMaterial = new THREE.MeshStandardMaterial({ color: "darkgreen" });

        const coneGeometry1 = new THREE.ConeGeometry(1, 3, 8);
        const tree1 = new THREE.Mesh(coneGeometry1, treeMaterial);
        tree1.position.set(-5, 1, -5); // y = height/2 + ground_offset = 3/2 - 0.5 = 1
        tree1.castShadow = true;
        scene.add(tree1);

        const coneGeometry2 = new THREE.ConeGeometry(1.5, 4, 8);
        const tree2 = new THREE.Mesh(coneGeometry2, treeMaterial);
        tree2.position.set(8, 1.5, -10); // y = 4/2 - 0.5 = 1.5
        tree2.castShadow = true;
        scene.add(tree2);

        // Example Character Placeholder (Box)
        const characterGeometry = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const characterMaterial = new THREE.MeshStandardMaterial({ color: "brown" });
        const character = new THREE.Mesh(characterGeometry, characterMaterial);
        character.position.set(0, 0.4, 5); // y = height/2 + ground_offset = 1.8/2 - 0.5 = 0.4
        character.castShadow = true;
        scene.add(character);

        // Placeholder for dynamically added objects (from config in JSX)
        // In this static HTML, you would either hardcode objects,
        // load from a JSON, or use another method.
        // Example:
        // const dynamicBoxGeo = new THREE.BoxGeometry(1, 1, 1);
        // const dynamicBoxMat = new THREE.MeshStandardMaterial({ color: 'saddlebrown' });
        // const dynamicBox = new THREE.Mesh(dynamicBoxGeo, dynamicBoxMat);
        // dynamicBox.position.set(2, 0, 2); // y = 1/2 - 0.5 = 0
        // scene.add(dynamicBox);

        // --- End Scene Content ---

        camera.position.set(0, 5, 15); // Adjust camera position
        controls.update(); // Update controls after setting camera position

        function animate() {
            requestAnimationFrame( animate );

            // Add any animations here (e.g., character movement)

            controls.update(); // Required if damping enabled
            renderer.render( scene, camera );
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
