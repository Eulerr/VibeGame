<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Scene - First Person</title> <!-- Updated Title -->
    <style>
        body { margin: 0; overflow: hidden; cursor: pointer; } /* Hide cursor, pointer for interaction */
        canvas { display: block; width: 100vw; height: 100vh; }
        #instructions {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            background-color: rgba(0,0,0,0.5);
            padding: 5px;
            z-index: 100;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="instructions">
        Click to play<br/>
        W, A, S, D = Move<br/>
        Mouse = Look<br/>
        Space = Jump
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module">
        import * as THREE from 'three';
        // We might not need OrbitControls anymore, but let's use PointerLockControls
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- Basic Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background
        scene.fog = new THREE.Fog(0x87CEEB, 0, 100); // Add fog for depth

        const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize( window.innerWidth, window.innerHeight );
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadows

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); // Reduced ambient
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0); // Increased directional
        directionalLight.position.set(10, 20, 15);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048; // Higher res shadow map
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100; // Adjust shadow camera frustum
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);
        // scene.add(new THREE.CameraHelper(directionalLight.shadow.camera)); // Optional helper

        // --- Scene Content ---

        // Ground plane
        const planeGeometry = new THREE.PlaneGeometry(100, 100); // Larger ground
        const textureLoader = new THREE.TextureLoader();
        const groundTexture = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg'); // Example grass texture
        groundTexture.wrapS = groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(25, 25); // Repeat texture
        groundTexture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // Use max anisotropy
        const planeMaterial = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 0.8, metalness: 0.2 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);

        // Platforms (Using slightly more interesting materials)
        const platformMaterial1 = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.5, metalness: 0.5 }); // Grey metal
        const platformGeometry1 = new THREE.BoxGeometry(5, 1, 5);
        const platform1 = new THREE.Mesh(platformGeometry1, platformMaterial1);
        platform1.position.set(0, 0, -10); // y = height/2 + ground_offset = 0.5 - 0.5 = 0
        platform1.castShadow = true;
        platform1.receiveShadow = true;
        scene.add(platform1);

        const platformMaterial2 = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.9 }); // Brown wood-like
        const platformGeometry2 = new THREE.BoxGeometry(3, 1, 3);
        const platform2 = new THREE.Mesh(platformGeometry2, platformMaterial2);
        platform2.position.set(8, 2, -15); // y = 1.5 (box center is 0.5 above base) + 0.5 (half box height) = 2
        platform2.castShadow = true;
        platform2.receiveShadow = true;
        scene.add(platform2);

        // Add some more platforms for variety
        const platformMaterial3 = new THREE.MeshStandardMaterial({ color: 0x4682B4, roughness: 0.6 }); // Steel Blue
        const platformGeometry3 = new THREE.BoxGeometry(2, 0.5, 4);
        const platform3 = new THREE.Mesh(platformGeometry3, platformMaterial3);
        platform3.position.set(15, 3.75, -12); // y = 3.5 + 0.25 = 3.75
        platform3.castShadow = true;
        platform3.receiveShadow = true;
        scene.add(platform3);

        const platformMaterial4 = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.3 }); // Gold
        const platformGeometry4 = new THREE.CylinderGeometry(1.5, 1.5, 0.5, 32); // Cylinder platform
        const platform4 = new THREE.Mesh(platformGeometry4, platformMaterial4);
        platform4.position.set(10, 5.25, -5); // y = 5 + 0.25 = 5.25
        platform4.castShadow = true;
        platform4.receiveShadow = true;
        scene.add(platform4);

        // --- First-Person Controls ---
        const controls = new PointerLockControls( camera, document.body ); // Lock to body instead of canvas for better fullscreen behavior
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            instructions.style.display = 'none';
        });

        controls.addEventListener('unlock', () => {
            instructions.style.display = '';
        });

        scene.add( controls.getObject() ); // Add camera holder to scene

        // Set initial camera position (player start)
        const playerHeight = 1.6; // Average human eye height
        const startPlatform = platform1;
        const startPlatformTopY = startPlatform.position.y + platformGeometry1.parameters.height / 2;
        controls.getObject().position.set( // Set position on the controls object directly
            startPlatform.position.x,
            startPlatformTopY + playerHeight,
            startPlatform.position.z
        );
        // Camera itself is at (0,0,0) relative to the controls object


        // --- Movement State ---
        const keys = {};
        document.addEventListener('keydown', (event) => {
            keys[event.code] = true;
            // console.log(`Key Down: ${event.code}`); // Debugging
        });
        document.addEventListener('keyup', (event) => {
            keys[event.code] = false;
             // console.log(`Key Up: ${event.code}`); // Debugging
        });

        const moveSpeed = 5.0; // Units per second
        const velocity = new THREE.Vector3(); // Used mainly for vertical movement (gravity, jump)
        const direction = new THREE.Vector3(); // Used for horizontal movement direction
        let canJump = true; // Simple jump flag
        const gravity = 30.0; // Acceleration due to gravity
        const jumpStrength = 10.0;

        const clock = new THREE.Clock();

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame( animate );

            const delta = clock.getDelta(); // Time since last frame

            if ( controls.isLocked === true ) {

                // Apply damping to horizontal velocity (makes stopping smoother)
                // Note: We are not directly using velocity.x/z for movement anymore,
                // but keeping this can be useful if you re-introduce physics forces later.
                // For now, it doesn't hurt much.
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                // Apply gravity
                velocity.y -= gravity * delta;

                // Calculate movement direction based on keyboard input
                // Use Number() to convert boolean true/false to 1/0
                direction.z = Number( keys['KeyW'] ) - Number( keys['KeyS'] );
                direction.x = Number( keys['KeyD'] ) - Number( keys['KeyA'] );
                direction.normalize(); // Ensures consistent speed diagonally

                // console.log(`Direction: x=${direction.x}, z=${direction.z}`); // Debugging

                // Calculate displacement for this frame based on direction and speed
                const moveForward = direction.z * moveSpeed * delta;
                const moveRight = direction.x * moveSpeed * delta;

                // Apply movement relative to the camera's orientation
                controls.moveForward(moveForward);
                controls.moveRight(moveRight);

                // Apply vertical movement (gravity/jump) to the controls object
                controls.getObject().position.y += velocity.y * delta;

                // Simple floor collision detection
                const groundLevel = plane.position.y + playerHeight; // Player height above ground plane y = -0.5
                if ( controls.getObject().position.y < groundLevel ) {
                    velocity.y = 0; // Stop falling
                    controls.getObject().position.y = groundLevel; // Snap to ground
                    canJump = true; // Allow jumping again
                }

                // Jumping
                 if ( keys['Space'] && canJump === true ) {
                    velocity.y = jumpStrength; // Apply upward impulse
                    canJump = false;
                    // console.log("Jump!"); // Debugging
                }
            }

            renderer.render( scene, camera );
        }
        animate();

        // --- Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
